@media not (prefers-reduced-transparency: reduce) {
  html.sb-glass-theme:not([data-card-blur=on]) #view :is(.card,.cal,.ux-group>summary,.ux-group[open]>.ux-body,.sheet-section>summary,.sheet-section[open]) {
    background: var(--sb-surface) !important;
    -webkit-backdrop-filter: none !important;

  }

<body>
<nav id='tabs'></nav>

<script src='range-inflight.js'></script>
<script src='fast.js'></script>
<script src='app.js'></script>
<script src='ux.js'></script>
<script src='settings.js'></script>
<script src='extras.js'></script>
<script src='files.js'></script>
<script src='news.js'></script>

<script src='hwx.js'></script>
<script src='plan.js'></script>
<script src='room.js'></script>
<script src='subj.js'></script>
<script>
(function () {
  let loading = false;
  function scan() {
    const panel = document.getElementById('subj-panel');
    if (loading || !panel || !panel.querySelector('.toolbar b')) return;
    loading = true;
    const script = document.createElement('script');
    script.src = 'library.js';
    script.onload = () => {
      observer.disconnect();
      // Wake the library observer for the panel that may already be open.
      const current = document.getElementById('subj-panel');
      if (current) current.append(document.createComment('library ready'));
    };
    script.onerror = () => {
      script.remove();
      loading = false;
      const current = document.getElementById('subj-panel');
      if (!current) return;
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'Повторить загрузку библиотеки';
      retry.onclick = () => { retry.remove(); scan(); };
      current.append(retry);
      observer.takeRecords();
    };
    document.head.append(script);
  }
  const observer = new MutationObserver(scan);
  observer.observe(document.body, { childList: true, subtree: true });
  scan();
})();
</script>
<script src='clubs.js'></script>
<script src='hwfold.js'></script>

</body>
