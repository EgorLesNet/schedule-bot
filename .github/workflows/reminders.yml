name: HW reminders

# Рассылка напоминаний о ДЗ и расписания на завтра. У Telegram Serverless нет планировщика,
# поэтому этот workflow раз в 5 минут выполняет endpoints/tick на платформе (npx tgcloud run).
# Нужен секрет TGCLOUD_TOKEN в окружении (Settings → Environments → TGCLOUD_TOKEN; токен: BotFather → бот → Serverless → CLI Access → Access token).
# Необязательные секреты для уведомления админа о сбое: BOT_TOKEN (токен бота из BotFather) и ADMIN_CHAT_ID (ваш id, команда /myid у бота).
# Расписание GitHub Actions работает только из ветки по умолчанию (сейчас это tgcloud).

on:
  schedule:
    # 03:00–20:55 UTC = 06:00–23:55 по Москве (время напоминаний в приложении: 06:00–23:30). GitHub может задержать запуск на несколько минут.
    - cron: '*/5 3-20 * * *'
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    environment: TGCLOUD_TOKEN
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tgcloud
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run reminders tick on Telegram Serverless
        working-directory: serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then echo "::error::Secret TGCLOUD_TOKEN is not set"; exit 1; fi
          mkdir -p .tgcloud
          # За один вызов отправляется не более 15 сообщений и не чаще раза в минуту, поэтому повторяем до 3 раз, пока есть что отправлять
          for i in 1 2 3; do
            OUT=$(npx -y -p @tgcloud/cli tgcloud run endpoints/tick '{}' --ctx '{ initData: { user: { id: 1 } } }' 2>&1) || { echo "$OUT"; exit 1; }
            echo "$OUT"
            if echo "$OUT" | grep -Eq 'sent[^0-9]{0,6}0([^0-9]|$)'; then break; fi
            if [ "$i" -lt 3 ]; then sleep 65; fi
          done
      - name: Notify admin about failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_CHAT_ID" ]; then echo "BOT_TOKEN или ADMIN_CHAT_ID не заданы, уведомление не отправлено"; exit 0; fi
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
            --data-urlencode "text=⚠️ Сбой рассылки напоминаний о ДЗ. Вероятные причины: токен TGCLOUD_TOKEN недействителен или ошибка в коде. Лог: ${RUN_URL}" > /dev/null
